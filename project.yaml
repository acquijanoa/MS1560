project:
  id: HC3383
  title: "HC3383 - Manuscript 1560 - Association of Preconception Socio-Behavioral Factors and Child Weight in HCHS/SOL"
  programmer: "Alvaro Quijano-Angarita"
  created: 2025-04-23
  description: "This project contains SAS code and outputs for Manuscript 1560, focused on maternal preconception socio-behavioral factors and child weight outcomes in the HCHS/SOL FLOR study."
  status: "completed"
  completion_date: 2026-05-20

scripts:
  - code: HC338302/HC338302.sas
    task: "Job 02 (adapted from SC HC338302): descriptive Table 1 with maternal preconception and child characteristics."
    software: SAS
    created: 2026-03-08
    status: "completed"

  - code: HC338351/HC338351.sas
    task: "Job 51: builds FLOR-only and all-eligible analytic datasets for QC."
    software: SAS
    created: 2025-11-03
    status: "completed"

  - code: HC338352/HC338352.sas
    task: "Job 52: missing-data pattern tables by manuscript domains using the FLOR analytic dataset."
    software: SAS
    created: 2025-11-03
    status: "completed"

  - code: HC338353/HC338353.sas
    task: "Job 53: multiple imputation (10 imputations, n=227 main sample); output HC338353_imputed_data_<datefile>; waz/bmiz in MI model; raw anthropometry not imputed."
    software: SAS
    created: 2025-11-03
    status: "completed"

  - code: HC338353a/HC338353a.sas
    task: "Job 53a: MI for the PRS-complete subset (n=201); same covariate logic as job 53 except child anthropometry and child_prs_bmi_a are not imputed."
    software: SAS
    created: 2025-11-03
    status: "completed"

  - code: HC338354/HC338354.sas
    task: "Job 54: pooled linear model for child WAZ across imputations (Models 1–4); produces Table 2.1 for the main sample."
    software: SAS
    created: 2025-11-03
    status: "completed"

  - code: HC338354a/HC338354a.sas
    task: "Job 54a: same pooled linear model as job 54 for WAZ on the PRS-complete imputed sample; produces Table 2.1a."
    software: SAS
    created: 2025-11-03
    status: "completed"

  - code: HC338358/HC338358.sas
    task: "Job 58: pooled logistic model for overweight/obese indicator BMIPCT_C2; produces Table 3."
    software: SAS
    created: 2025-11-04
    status: "completed"

  - code: HC338358a/HC338358a.sas
    task: "Job 58a: same BMIPCT_C2 logistic model as job 58 on the PRS-complete imputed sample; produces Table 3a."
    software: SAS
    created: 2025-11-04
    status: "completed"

  - code: HC338361/HC338361.sas
    task: "Job 61: same pooled model Table 2 structure as job 54 with response BMIZ instead of WAZ."
    software: SAS
    created: 2026-04-13
    status: "completed"

  - code: HC338361a/HC338361a.sas
    task: "Job 61a: BMIZ Table 2 pipeline parallel to job 61 for the PRS-complete imputed sample."
    software: SAS
    created: 2026-04-13
    status: "completed"

  - code: HC338362/HC338362.sas
    task: "Job 62: pooled linear model for WAZ with child adjusted by HAZ; Table 2.2."
    software: SAS
    created: 2026-04-13
    status: "completed"

  - code: HC338362a/HC338362a.sas
    task: "Job 62a: same WAZ + HAZ adjustment as job 62 on the PRS-complete imputed sample; Table 2.2a."
    software: SAS
    created: 2026-04-13
    status: "completed"

  - code: HC338363/HC338363.sas
    task: "Job 63: pooled linear model for birth weight-for-gestational-age z-score (birthwt_ga_z); produces Table 5."
    software: SAS
    created: 2026-04-27
    status: "completed"

  - code: HC338363a/HC338363a.sas
    task: "Job 63a: birthwt_ga_z linear model pipeline; produces Table 5a."
    software: SAS
    created: 2026-04-27
    status: "completed"

  - code: HC338364/HC338364.sas
    task: "Job 64: pooled ordinal model for child BMI category BMIPCT_C3 (normal/overweight/obese); Table 4 (main sample)."
    software: SAS
    created: 2026-04-30
    status: "completed"

  - code: HC338364a/HC338365.sas
    task: "Job 65: BMIPCT_C3 ordinal OR table (proportional odds; Model 4 covariates)."
    software: SAS
    created: 2026-04-30
    status: "completed"

  - code: HC338357/HC338357.sas
    task: "Job 57: inclusion/exclusion table for analytic sample construction."
    software: SAS
    created: 2025-11-03
    status: "completed"

  - code: HC338390/HC338390.sas
    task: "Job 90: centralized PROC FORMAT definitions for categorical displays and reporting conventions used downstream."
    software: SAS
    created: 2025-11-03
    status: "completed"

  - code: HC338391/
    task: "Job 91: shared SAS macros used across jobs (labels for PROC REPORT-style tables, pooling multiply imputed results, partial R² helpers, anonymization utilities)."
    software: SAS
    created: 2025-11-03
    status: "completed"

  - code: HC338398/
    task: "Job 98: analytic file QC—cross-checks and comparisons vs Statistical Computing reference datasets."
    software: SAS
    created: 2025-11-03
    status: "completed"

  - code: HC338399/
    task: "Job 99 miscellaneous scripts."
    software: SAS
    created: 2025-11-03
    status: "completed"
